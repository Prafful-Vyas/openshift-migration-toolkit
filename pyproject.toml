[project]
name = "openshift-migration-toolkit"
version = "0.1.0"
description = "Plan, render and gate application migrations to OpenShift against BCP/DR targets (RTO/RPO)"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ocmigrate = "ocmigrate.cli:main"

[tool.setuptools.packages.find]
include = ["ocmigrate*"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
