---
# Apply one migration wave to OpenShift and verify it, app by app.
#
#   ocmigrate render inventory.yml --namespace payments --out out
#   ocmigrate waves  inventory.yml --out out/waves.json
#   ansible-playbook ansible/migrate-wave.yml -e wave=1 -e target_namespace=payments
#
# Requires the kubernetes.core collection and a kubeconfig logged in with `oc login`.
- name: Migrate one wave to OpenShift
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    out_dir: "{{ playbook_dir }}/../out"
    site: primary
    rollout_timeout: 600
  tasks:
    - name: Require the wave number and target namespace
      ansible.builtin.assert:
        that:
          - wave is defined
          - target_namespace is defined
        fail_msg: "pass -e wave=<n> -e target_namespace=<ns>"

    - name: Load the wave plan
      ansible.builtin.set_fact:
        wave_apps: "{{ (lookup('ansible.builtin.file', out_dir + '/waves.json') | from_json | selectattr('wave', 'equalto', wave | int) | first).apps }}"

    - name: Apply the namespace-wide default-deny ingress policy
      kubernetes.core.k8s:
        state: present
        namespace: "{{ target_namespace }}"
        src: "{{ out_dir }}/{{ site }}/00-default-deny.yaml"

    - name: Migrate each app in the wave (sequentially, stop on first failure)
      ansible.builtin.include_tasks: migrate-app.yml
      loop: "{{ wave_apps }}"
      loop_control:
        loop_var: app
        label: "{{ app.name }} (tier {{ app.tier }})"
