---
# Included once per app by migrate-wave.yml.
- name: Apply manifests for {{ app.name }}
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace }}"
    src: "{{ out_dir }}/{{ site }}/{{ app.name }}.yaml"
    apply: true

- name: Wait for rollout of {{ app.name }}
  when: app.kind == 'service'
  kubernetes.core.k8s_info:
    kind: Deployment
    name: "{{ app.name }}"
    namespace: "{{ namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: "{{ rollout_timeout }}"

- name: Look up the route of {{ app.name }}
  when: app.kind == 'service'
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: "{{ app.name }}"
    namespace: "{{ namespace }}"
  register: route

- name: Smoke test through the router for {{ app.name }}
  when: app.kind == 'service' and route.resources | length > 0
  ansible.builtin.uri:
    url: "https://{{ route.resources[0].spec.host }}/healthz"
    status_code: 200
    validate_certs: true
  register: smoke
  retries: 10
  delay: 6
  until: smoke.status == 200

- name: Trigger a one-off run of the batch job {{ app.name }}
  when: app.kind == 'batch' and site == 'primary'
  ansible.builtin.command:
    argv:
      - oc
      - create
      - job
      - -n
      - "{{ namespace }}"
      - "{{ app.name }}-smoke-{{ lookup('ansible.builtin.pipe', 'date +%s') }}"
      - "--from=cronjob/{{ app.name }}"
  changed_when: true
